services:
  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: pet-chatbot-backend
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY}
      - LANGSMITH_TRACING_V2=${LANGSMITH_TRACING_V2:-false}
      - VECTORSTORE_PATH=/app/data/ChromaDB_bge_m3
      - COLLECTION_NAME=pet_health_qa_system_bge_m3
    volumes:
      # 벡터스토어 데이터 마운트 (읽기/쓰기 권한)
      - ./data:/app/data
      # src 폴더 마운트 (ensemble.py 등)
      - ./src:/app/src:ro
      # 개발 시 코드 hot-reload (선택)
      # - ./backend/app:/app/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - pet-chatbot-network

  # Streamlit Frontend
  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    container_name: pet-chatbot-frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pet-chatbot-network

networks:
  pet-chatbot-network:
    driver: bridge

volumes:
  chroma-data:
